<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>AEK CK Monitor</title>
<script id="aekck-data" type="application/json"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F0E8; --surface:#FFFFFF; --surface2:#ECEBE2; --surface3:#E2E1D6; --line:#D9D7CB;
  --fg:#111111; --muted:#6B6B64; --accent:#FFCC00; --accent2:#FFB800; --accent-ink:#111111;
  --good:#1E9B49; --warn:#C27C08; --bad:#D3352F; --sil:#D4D2C7;
  --shadow:0 10px 30px rgba(17,17,17,.08), 0 1px 2px rgba(17,17,17,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  --r:20px; color-scheme:light;
}
body[data-look="dark"]{
  --bg:#0A0A0A; --surface:#151515; --surface2:#1D1D1D; --surface3:#262626; --line:#2B2B2B;
  --fg:#F5F4EE; --muted:#9C9C94; --good:#3FD070; --warn:#F3B13C; --bad:#F0514B; --sil:#262626;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* shell */
.app{height:100%;display:flex;width:100%}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.mono{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:15px;flex:none}
.who{flex:1;min-width:0}
.who .name{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.who .date{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.look{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.look svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.view{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
.view>*{grid-column:span 12;min-width:0}
.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tabs button svg,.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg)}
.tabs button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.dotn{position:absolute;top:7px;right:calc(50% - 19px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:248px;flex:none;background:var(--fg);color:#F5F4EE;padding:24px 18px 18px;gap:8px;height:100%}
  body[data-look="dark"] .side{background:#000;border-right:1px solid var(--line)}
  .side .brand{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;padding:4px 6px 0}
  .side .brand .mono{width:46px;height:46px;font-size:16px}
  .side .brand .t{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase}
  .side .brand .t span{color:var(--accent)}
  .navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;color:#B9B8AF;text-align:left;width:100%;position:relative}
  .navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
  .navbtn.on{background:var(--accent);color:var(--accent-ink)}
  .navbtn .dotn{position:static;margin-left:auto;box-shadow:none}
  .side .spacer{flex:1}
  .side .foot{font-size:11px;color:#B9B8AF;letter-spacing:.08em;text-transform:uppercase;padding:0 6px;line-height:1.5}
  .tabs{display:none}
  .top{padding-left:28px;padding-right:28px;padding-block:16px}
  .top .mono{display:none}
  .top .who .name{font-size:30px}
  .scroll{padding-left:28px;padding-right:28px;padding-block:22px 40px}
  .view{gap:18px}
  .c6{grid-column:span 6!important}.c4{grid-column:span 4!important}.c8{grid-column:span 8!important}.c3{grid-column:span 3!important}
}
@media (min-width:1400px){.scroll{padding-left:40px;padding-right:40px}.view{gap:22px}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2{font-size:26px;font-weight:800;margin-top:3px}
.view.enter>.card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.view.enter>.card:nth-child(2){animation-delay:.05s}.view.enter>.card:nth-child(3){animation-delay:.1s}.view.enter>.card:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:22px 20px}
.hero .eyebrow{color:rgba(0,0,0,.6)}
.hero h1{font-size:40px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:8px 0 0;font-size:14px;color:rgba(0,0,0,.75);max-width:52ch}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.pill.y{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.k{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.g{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.w{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.r{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pill.sm{padding:3px 8px;font-size:10.5px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:14px;padding:12px 12px 10px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi.y{background:var(--accent);color:var(--accent-ink)}.kpi.y .k{color:rgba(0,0,0,.6)}
.kpi.r{background:color-mix(in srgb,var(--bad) 16%,transparent)}.kpi.r .v{color:var(--bad)}
.kpi.w{background:color-mix(in srgb,var(--warn) 16%,transparent)}.kpi.w .v{color:var(--warn)}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--muted);transition:all .15s}
.seg button.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.chip.y{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin-top:12px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:10px 14px;font-size:16px;width:auto;margin-top:0}
.btn[disabled]{opacity:.5;cursor:default}
.row2{display:flex;gap:10px}.row2>*{flex:1}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inp{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600;width:100%;color:var(--fg)}
.inp.num{font-family:var(--display);font-size:20px;text-align:center;font-weight:800}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.bar{height:8px;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar i.w{background:var(--warn)}.bar i.r{background:var(--bad)}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.35}

/* player list */
.plist{display:flex;flex-direction:column;margin:0 -18px -18px}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);text-align:left;width:100%}
.prow:hover{background:var(--surface2)}
.prow .n{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);text-align:center}
.prow .nm{font-weight:700;font-size:15.5px;line-height:1.1}
.prow .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.prow .sub .bar{max-width:120px;min-width:70px}
.prow .val{font-family:var(--display);font-weight:900;font-size:22px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.prow .val small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.prow.dim{opacity:.55}

/* entry grid */
.erow{display:grid;grid-template-columns:34px 1fr 92px 86px;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.erow .n{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);text-align:center}
.erow .nm{font-weight:700;font-size:15px}
.erow .nm small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.erow .inp{padding:8px 6px}
.erow select.inp{padding:8px 26px 8px 8px;font-size:13px;font-weight:700}
.erow.filled .nm{color:var(--fg)}
.erow.flag-r .inp.num{border-color:var(--bad);color:var(--bad)}
.erow.flag-w .inp.num{border-color:var(--warn);color:var(--warn)}

/* baseline grid */
.brow{display:grid;grid-template-columns:34px 1fr repeat(4,56px) 70px;gap:6px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.brow .inp{padding:8px 4px;font-size:16px}
.brow .res{font-family:var(--display);font-weight:900;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.brow .res small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brow .nm{font-weight:700;font-size:15px;line-height:1.1}
.brow .nm small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.bhead{display:grid;grid-template-columns:34px 1fr repeat(4,56px) 70px;gap:6px;padding:4px 18px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.bhead span:nth-child(2){text-align:left}
@media (max-width:480px){
  .brow,.bhead{grid-template-columns:28px 1fr repeat(4,46px) 58px;gap:4px;padding-inline:12px}
  .brow .inp{font-size:14px;padding:8px 2px}
  .erow{grid-template-columns:28px 1fr 78px 80px;padding-inline:12px}
}

/* chart */
.chartwrap{position:relative;width:100%}
.chartwrap svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table td.num,.table th.num{text-align:right;font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.table tr:last-child td{border-bottom:0}
.mini{padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700}
.mini.r{color:var(--bad)}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:20;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.note b{color:var(--fg)}
.stepper{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.stepper:first-of-type{border-top:0}
.stepper .d{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:900;display:grid;place-items:center;flex:none;font-size:15px}
.stepper .d.y{background:var(--accent);color:var(--accent-ink)}
.stepper b{display:block;font-family:var(--display);font-size:18px;font-weight:800}
.stepper span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.tabs,.side,.look,.btn{display:none!important}.scroll{overflow:visible}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mono">AEK</div><div class="t">CK<br><span>Monitor</span></div></div>
    <nav id="sidenav"></nav>
    <div class="spacer"></div>
    <div class="foot">Performance Department<br>Season 2026-27</div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="mono">AEK</div>
      <div class="who"><div class="name" id="ttl">CK Monitor</div><div class="date" id="sub">Performance Department</div></div>
      <button class="look" id="lookBtn" title="Light / dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>
    <main class="scroll" id="scroll"><div class="view enter" id="view"></div></main>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const KEY="aekck:v1";
const ACTS=[["FG","Full game"],["PG","Partial game"],["PG+T","Partial game + training"],["TR","Training session"],["OFF","Day off"],["TEST","Isolated re-test"],["INJ","Injured / unavailable"]];
const ACT_LABEL=Object.fromEntries(ACTS);
const ACT_COLOR={FG:"var(--fg)",PG:"#5B5B55",["PG+T"]:"#8A8A80",TR:"var(--accent2)",OFF:"var(--good)",TEST:"#4A7BD0",INJ:"var(--bad)"};
const ROSTER=[
 ["","Strakosha","GK"],["","Brignoli","GK"],["","Balamotis","GK"],
 ["2","Moukoudi","DEF"],["3","Pilios","DEF"],["5","Alexiou","DEF"],["6","Kairinen","MID"],["7","Kutesa","FWD"],
 ["8","Gacinovic","MID"],["9","Jovic","FWD"],["10","Zubkov","FWD"],["11","Koita","FWD"],["12","Rota","DEF"],
 ["14","Majer","MID"],["15","Georgiev","DEF"],["16","Ariaga","DEF"],["17","Kaloskamis","FWD"],["18","Marin","MID"],
 ["20","Mantalos","MID"],["21","Vida","DEF"],["25","Varga","FWD"],["27","Vitalis","FWD"],["44","Relvas","DEF"],
 ["57","Christakopoulos","MID"],["80","Sahabo","MID"],["90","Zine","FWD"],["99","Argyriou","FWD"],["","Likogiannis","DEF"]
];
function freshState(){
  return {
    v:1,
    players:ROSTER.map((r,i)=>({id:"p"+(i+1),num:r[0],name:r[1],pos:r[2],active:true})),
    baseline:{},            // id -> {s:[n,n,n,n], manual:null}
    tests:[],               // {id, date:'YYYY-MM-DD', pid, val, act, note}
    settings:{elev:1.5,high:2.0,look:"light"}
  };
}
let bootMsg=null; let S=load();
function load(){
  let L=null; try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); if(o&&o.players) L=migrate(o);}}catch(e){}
  const E=embeddedData();
  if(E&&!L){ L=migrate(E); L.absorbedSnapshot=E.exportedAt||0; bootMsg="Snapshot loaded"+(E.exportedBy?" from "+E.exportedBy:""); try{localStorage.setItem(KEY,JSON.stringify(L));}catch(e){} }
  else if(E&&L&&(E.exportedAt||0)>(L.absorbedSnapshot||0)){ const r=mergeInto(L,E); L.absorbedSnapshot=E.exportedAt; bootMsg="Snapshot merged: "+r.added+" new, "+r.updated+" updated"; try{localStorage.setItem(KEY,JSON.stringify(L));}catch(e){} }
  return L||freshState();
}
function migrate(o){ const f=freshState(); o.settings=Object.assign(f.settings,o.settings||{}); o.baseline=o.baseline||{}; o.tests=o.tests||[]; return o; }
function save(){ S.savedAt=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ toast("Could not save on this device"); } }
function embeddedData(){ try{ const el=document.getElementById("aekck-data"); const txt=el&&el.textContent.trim(); if(txt){ const o=JSON.parse(txt); if(o&&o.players) return o; } }catch(e){} return null; }
function mergeInto(L,E){
  // roster: union by id, E fields win for players E knows
  const pm=Object.fromEntries(L.players.map(p=>[p.id,p]));
  (E.players||[]).forEach(p=>{ if(pm[p.id]) Object.assign(pm[p.id],p); else L.players.push(p); });
  // baselines: per player, newer ts wins; if no ts, keep the one with content
  Object.entries(E.baseline||{}).forEach(([pid,b])=>{ const l=L.baseline[pid]; const has=x=>x&&((x.s||[]).some(v=>v>0)||x.manual>0);
    if(!l||(b.ts||0)>(l.ts||0)||(!has(l)&&has(b))) L.baseline[pid]=b; });
  // tests: by id, newer ts wins; same date+player without id match -> keep both only if different ids
  const tm=Object.fromEntries(L.tests.map(t=>[t.id,t])); let added=0,updated=0;
  (E.tests||[]).forEach(t=>{ const l=tm[t.id]; if(!l){ const dup=L.tests.find(x=>x.pid===t.pid&&x.date===t.date); if(dup){ if((t.ts||0)>(dup.ts||0)){Object.assign(dup,t);updated++;} } else { L.tests.push(t); tm[t.id]=t; added++; } }
    else if((t.ts||0)>(l.ts||0)){ Object.assign(l,t); updated++; } });
  if(E.settings){ L.settings.elev=E.settings.elev||L.settings.elev; L.settings.high=E.settings.high||L.settings.high; }
  return {added,updated};
}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtD=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return d+"."+m+"."+y.slice(2);};
const fmtDL=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return d+"."+m+"."+y;};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const r0=x=>x==null?"":Math.round(x);

/* ============ MODEL ============ */
function playerTests(pid){ return S.tests.filter(t=>t.pid===pid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
function baselineOf(pid){
  const b=S.baseline[pid]||{s:[],manual:null};
  if(b.manual!=null&&b.manual>0) return {v:b.manual,src:"manual"};
  const s=(b.s||[]).filter(x=>typeof x==="number"&&x>0);
  if(s.length) return {v:mean(s),src:"rested",n:s.length};
  const t=playerTests(pid);
  const off=t.filter(x=>x.act==="OFF").map(x=>x.val); if(off.length) return {v:mean(off),src:"est. day off",n:off.length};
  const tr=t.filter(x=>x.act==="TR").map(x=>x.val);   if(tr.length)  return {v:mean(tr),src:"est. training",n:tr.length};
  return {v:null,src:"none"};
}
function statusOf(pid){
  const t=playerTests(pid); const last=t.length?t[t.length-1]:null;
  const b=baselineOf(pid);
  let pct=null,st="none";
  if(last&&b.v){ pct=last.val/b.v; st=pct>=S.settings.high?"HIGH":pct>=S.settings.elev?"ELEVATED":"NORMAL"; }
  else if(last) st="nobase";
  return {last,base:b,pct,st,tests:t};
}
const pillCls={HIGH:"r",ELEVATED:"w",NORMAL:"g",none:"",nobase:"y"};
const stLabel={HIGH:"High",ELEVATED:"Elevated",NORMAL:"Normal",none:"No data",nobase:"No baseline"};
function avgByAct(t,codes){ const v=t.filter(x=>codes.includes(x.act)).map(x=>x.val); return v.length?mean(v):null; }
function activePlayers(){ return S.players.filter(p=>p.active!==false); }
function lastDrawDate(){ return S.tests.length?S.tests.map(t=>t.date).sort().pop():null; }

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1800); }

/* ============ SQUAD ============ */
let squadFilter="all";

  const order={HIGH:0,ELEVATED:1,NORMAL:2,nobase:3,none:4};

  if(squadFilter==="flag") list=list.filter(x=>x.st==="HIGH"||x.st==="ELEVATED");

  const hero=S.tests.length?"":`<div class="card hero"><div class="eyebrow">Start here</div><h1>Baseline first</h1><p>CK is highly individual. Before any match or training sample is read, each player needs 2 to 4 rested samples. Set them on the Baseline tab, then log draws on Entry.</p><button class="btn dark" data-go="baseline">Set baselines</button></div>`;
  const rows=list.map(x=>{
    const pct=x.pct; const w=pct==null?0:Math.min(100,pct/3*100);
    const cls=x.st==="HIGH"?"r":x.st==="ELEVATED"?"w":"";
    return `<button class="prow ${x.st==="none"?"dim":""}" data-p="${x.p.id}">
      <div class="n">${x.p.num||x.p.pos}</div>
      <div><div class="nm">${x.p.name}</div>
        <div class="sub">${x.base.v?`<span>base ${r0(x.base.v)}</span><div class="bar"><i class="${cls}" style="width:${w}%"></i><em style="left:${100/3}%"></em><em style="left:${100/3*S.settings.elev}%"></em><em style="left:${100/3*S.settings.high}%"></em></div>`:`<span>${x.last?"no baseline yet":"no samples yet"}</span>`}</div>
      </div>
      <div class="val">${x.last?r0(x.last.val):"–"}<small>${x.last?(pct!=null?Math.round(pct*100)+"% · ":"")+fmtD(x.last.date)+" · "+x.last.act:"no data"}</small></div>
    </button>`;}).join("");
  document.getElementById("view").innerHTML=hero+`
  <div class="card c4"><div class="eyebrow">Last draw${ld?" · "+fmtDL(ld):""}</div><div class="kpis" style="margin-top:10px">
    <div class="kpi"><div class="k">Tested</div><div class="v">${tested}<small>/ ${P.length}</small></div></div>
    <div class="kpi ${nH?"r":""}"><div class="k">High</div><div class="v">${nH}</div></div>
    <div class="kpi ${nE?"w":""}"><div class="k">Elevated</div><div class="v">${nE}</div></div></div>
    <div class="note" style="margin-top:12px">${nB?`<b>${nB}</b> player${nB===1?"":"s"} without a baseline. `:""}Bars show last CK as a share of baseline. Marks at 1x, ${S.settings.elev}x and ${S.settings.high}x.</div>
    ${ld?`<button class="btn ghost sm" style="margin-top:12px" id="copySum">Copy summary for WhatsApp</button>`:""}</div>
  <div class="card c8"><div class="head"><div><div class="eyebrow">Players</div><h2>Who needs attention</h2></div>
    <div class="seg"><button class="${squadFilter==="all"?"on":""}" data-f="all">All</button><button class="${squadFilter==="flag"?"on":""}" data-f="flag">Flagged</button><button class="${squadFilter==="nobase"?"on":""}" data-f="nobase">No base</button></div></div>
    <div class="plist">${rows||'<div class="note" style="padding:14px 18px">Nothing to show for this filter.</div>'}</div></div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{squadFilter=b.dataset.f;render();});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go("player",b.dataset.p));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const cs=document.getElementById("copySum"); if(cs) cs.onclick=()=>copyText(summaryText(ld));
}
function summaryText(ld){
  const P=activePlayers(); const st=P.map(p=>({p,...statusOf(p.id)})).filter(x=>x.last&&x.last.date===ld);
  const line=x=>`${x.p.num?"#"+x.p.num+" ":""}${x.p.name}: ${r0(x.last.val)} U/L (${x.pct!=null?Math.round(x.pct*100)+"% of base":"no base"}, ${x.last.act})`;
  const H=st.filter(x=>x.st==="HIGH"), E=st.filter(x=>x.st==="ELEVATED");
  let s=`AEK CK ${fmtDL(ld)}\nTested ${st.length}/${P.length}\n`;
  s+=`\nHIGH (${H.length})\n`+(H.map(line).join("\n")||"none");
  s+=`\n\nELEVATED (${E.length})\n`+(E.map(line).join("\n")||"none");
  return s;
}
function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>fallbackCopy(t));} else fallbackCopy(t); }
function fallbackCopy(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Copied");}catch(e){toast("Copy failed");} ta.remove(); }

/* ============ ENTRY ============ */
let entry={date:todayISO(),act:"TR"};
function vEntry(){
  setTitle("Entry","Log one draw for the whole squad");
  const P=activePlayers();
  const existing=Object.fromEntries(S.tests.filter(t=>t.date===entry.date).map(t=>[t.pid,t]));
  const rows=P.map(p=>{
    const e=existing[p.id]; const b=baselineOf(p.id);
    let fl=""; if(e&&b.v){const pc=e.val/b.v; fl=pc>=S.settings.high?"flag-r":pc>=S.settings.elev?"flag-w":"";}
    return `<div class="erow ${e?"filled":""} ${fl}" data-pid="${p.id}">
      <div class="n">${p.num||p.pos}</div>
      <div class="nm">${p.name}<small>${b.v?"base "+r0(b.v):"no baseline"}</small></div>
      <input class="inp num" type="number" inputmode="decimal" min="0" step="1" placeholder="CK" value="${e?e.val:""}" data-val>
      <select class="inp" data-act>${ACTS.map(([c])=>`<option ${((e?e.act:entry.act)===c)?"selected":""}>${c}</option>`).join("")}</select>
    </div>`;}).join("");
  document.getElementById("view").innerHTML=`
  <div class="card c4"><div class="head"><div><div class="eyebrow">Draw</div><h2>Date and default activity</h2></div></div>
    <div class="field"><label>Test date</label><input class="inp" type="date" id="eDate" value="${entry.date}"></div>
    <div class="field" style="margin-top:10px"><label>Activity before the draw (applies to all, change per player if needed)</label>
      <select class="inp" id="eAct">${ACTS.map(([c,l])=>`<option value="${c}" ${entry.act===c?"selected":""}>${c} · ${l}</option>`).join("")}</select></div>
    <div class="note" style="margin-top:12px">Values in U/L. Leave a player empty if not tested. Saved per player as you type.</div>
    <div class="chips" style="margin-top:12px">${ACTS.map(([c,l])=>`<span class="chip">${c} <span class="muted">${l}</span></span>`).join("")}</div>
  </div>
  <div class="card c8"><div class="head"><div><div class="eyebrow">${fmtDL(entry.date)}</div><h2>Squad values</h2></div><span class="pill" id="eCount"></span></div>
    <div class="plist">${rows}</div>
    <button class="btn" id="eDone">Done, go to Squad</button>
  </div>`;
  const upd=()=>{ const n=Object.keys(S.tests.filter(t=>t.date===entry.date).reduce((a,t)=>(a[t.pid]=1,a),{})).length; document.getElementById("eCount").textContent=n+" / "+P.length+" entered"; };
  upd();
  document.getElementById("eDate").onchange=e=>{entry.date=e.target.value||todayISO();render();};
  document.getElementById("eAct").onchange=e=>{entry.act=e.target.value; document.querySelectorAll(".erow").forEach(r=>{const pid=r.dataset.pid; if(!existing[pid]) r.querySelector("[data-act]").value=entry.act; else{ /* also update saved act for this draw */ existing[pid].act=entry.act; existing[pid].ts=Date.now(); r.querySelector("[data-act]").value=entry.act; } }); save(); toast("Activity set for this draw");};
  document.querySelectorAll(".erow").forEach(r=>{
    const pid=r.dataset.pid, vi=r.querySelector("[data-val]"), ai=r.querySelector("[data-act]");
    const commit=()=>{
      const v=parseFloat(vi.value); const act=ai.value;
      let t=S.tests.find(x=>x.date===entry.date&&x.pid===pid);
      if(isNaN(v)||v<=0){ if(t){S.tests=S.tests.filter(x=>x!==t);} r.classList.remove("filled","flag-r","flag-w"); }
      else { if(!t){t={id:uid(),date:entry.date,pid,val:v,act,ts:Date.now()}; S.tests.push(t);} else {t.val=v;t.act=act;t.ts=Date.now();} r.classList.add("filled");

  });
  document.getElementById("eDone").onclick=()=>go("squad");
}

    <div class="note" style="margin-top:10px">Full-game CK that keeps climbing across the season, or that recovers slower than the player's usual, is the signal to watch.</div>
  </div>
  <div class="card c8"><div class="head"><div><div class="eyebrow">Samples</div><h2>History</h2></div></div>
    ${t.length?`<table class="table"><tr><th>Date</th><th>Act</th><th class="num">CK</th><th class="num">vs base</th><th></th></tr>${hist}</table>`:'<div class="note">No samples yet for this player.</div>'}
  </div>`;
  document.getElementById("pSel").onchange=e=>{curPid=e.target.value;render();};
  document.getElementById("pMan").addEventListener("input",e=>{ const v=parseFloat(e.target.value); const bb=S.baseline[p.id]||(S.baseline[p.id]={s:[null,null,null,null],manual:null}); bb.manual=isNaN(v)||v<=0?null:v; bb.ts=Date.now(); save(); });
  document.getElementById("pMan").addEventListener("change",()=>render());
  document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>go(x.dataset.go));
  document.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{ if(confirm("Delete this sample?")){ S.tests=S.tests.filter(y=>y.id!==x.dataset.del); save(); render(); } });
}
function svgChart(t,base){
  const W=720,H=260,L=42,R=14,T=16,B=34;
  if(!t.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-family="Barlow" font-size="14">No samples yet</text></svg>`;
  const vals=t.map(x=>x.val); let maxV=Math.max(...vals, base?base*S.settings.high*1.1:0)*1.1; maxV=Math.ceil(maxV/100)*100||100;
  const n=t.length; const xs=i=>n===1?(L+(W-L-R)/2):L+(W-L-R)*i/(n-1); const ys=v=>T+(H-T-B)*(1-v/maxV);
  let g=""; const step=maxV<=600?100:maxV<=1500?250:500;
  for(let v=0;v<=maxV;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow">${v}</text>`;
  let bands="";
  if(base){ bands+=`<rect x="${L}" y="${ys(maxV)}" width="${W-L-R}" height="${Math.max(0,ys(base*S.settings.high)-ys(maxV))}" fill="var(--bad)" opacity=".06"/>`;
    bands+=`<rect x="${L}" y="${ys(base*S.settings.high)}" width="${W-L-R}" height="${Math.max(0,ys(base*S.settings.elev)-ys(base*S.settings.high))}" fill="var(--warn)" opacity=".08"/>`;
    bands+=`<line x1="${L}" x2="${W-R}" y1="${ys(base)}" y2="${ys(base)}" stroke="var(--accent)" stroke-width="2.5"/>`;
    bands+=`<line x1="${L}" x2="${W-R}" y1="${ys(base*S.settings.elev)}" y2="${ys(base*S.settings.elev)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    bands+=`<line x1="${L}" x2="${W-R}" y1="${ys(base*S.settings.high)}" y2="${ys(base*S.settings.high)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>`; }
  const path=t.map((x,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(x.val).toFixed(1)).join(" ");
  const pts=t.map((x,i)=>{const c=ACT_COLOR[x.act]||"var(--fg)"; const pc=base?x.val/base:null; const ring=pc!=null&&pc>=S.settings.high?`<circle cx="${xs(i)}" cy="${ys(x.val)}" r="10" fill="none" stroke="var(--bad)" stroke-width="2"/>`:"";
    return ring+`<circle cx="${xs(i)}" cy="${ys(x.val)}" r="5.5" fill="${c}" stroke="var(--surface)" stroke-width="2"><title>${fmtDL(x.date)} · ${x.act} · ${r0(x.val)} U/L${pc!=null?" · "+Math.round(pc*100)+"%":""}</title></circle>`;}).join("");
  const lbl=t.map((x,i)=>{ const show=n<=8||i%Math.ceil(n/8)===0||i===n-1; return show?`<text x="${xs(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Barlow">${fmtD(x.date)}</text>`:"";}).join("");
  return `<svg viewBox="0 0 ${W} ${H}">${g}${bands}<path d="${path}" fill="none" stroke="var(--fg)" stroke-width="1.5" opacity=".35"/>${pts}${lbl}</svg>`;
}

/* ============ DATA ============ */
function vData(){
  setTitle("Data","Backup, export, thresholds, roster");
  const nT=S.tests.length, nD=new Set(S.tests.map(t=>t.date)).size;
  const roster=S.players.map(p=>`<tr class="${p.active===false?"muted":""}"><td style="width:54px"><input class="inp" style="padding:6px;text-align:center;font-weight:800" value="${p.num}" data-num="${p.id}" placeholder="#"></td><td><input class="inp" style="padding:6px 8px" value="${p.name}" data-name="${p.id}"></td><td style="width:70px"><select class="inp" style="padding:6px 24px 6px 6px;font-size:13px" data-pos="${p.id}">${["GK","DEF","MID","FWD"].map(x=>`<option ${p.pos===x?"selected":""}>${x}</option>`).join("")}</select></td><td style="width:70px;text-align:right"><button class="mini ${p.active===false?"":"r"}" data-tog="${p.id}">${p.active===false?"Restore":"Hide"}</button></td></tr>`).join("");
  document.getElementById("view").innerHTML=`
  <div class="card c6"><div class="head"><div><div class="eyebrow">This device</div><h2>Backup and export</h2></div><span class="pill">${nT} samples · ${nD} draws</span></div>
    <div class="note">Data lives in this browser only. <b>Share snapshot</b> makes a copy of this app with all current data inside, ready to send as a document on WhatsApp. Whoever opens it sees the same squad and can keep entering. When they send their copy back, <b>Import</b> merges it with yours (newer entry wins), nothing is lost.</div>
    <div class="field" style="margin-top:12px"><label>Your name on the snapshot</label><input class="inp" id="sBy" placeholder="e.g. Goran" value="${S.settings.by||""}"></div>
    <button class="btn sm" style="margin-top:12px;width:100%" id="expS">Share snapshot (HTML with data)</button>
    <label class="btn dark sm" style="margin-top:10px;display:flex;width:100%">Import snapshot or backup (merge)<input type="file" accept=".html,.htm,.json,text/html,application/json" id="impJ" class="hidden"></label>
    <div class="row2"><button class="btn ghost sm" style="margin-top:10px" id="expJ">Backup (JSON)</button><button class="btn ghost sm" style="margin-top:10px" id="expC">Export CSV</button></div>
    <button class="btn danger sm" style="margin-top:10px" id="wipe">Delete all samples and baselines</button>
  </div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Thresholds</div><h2>Flag rules</h2></div></div>
    <div class="row2"><div class="field"><label>Elevated at (x baseline)</label><input class="inp num" type="number" step="0.1" min="1" id="sElev" value="${S.settings.elev}"></div>
    <div class="field"><label>High at (x baseline)</label><input class="inp num" type="number" step="0.1" min="1" id="sHigh" value="${S.settings.high}"></div></div>
    <div class="note" style="margin-top:12px">Post-match CK in professional players commonly reaches 2 to 4 times resting values and returns toward baseline within 48 to 72 h. Flags here are a screening prompt, read together with wellness and GPS load, not a diagnosis.</div>
    <div class="note" style="margin-top:8px">References: Lazarim et al. 2009 (J Sci Med Sport); Hecksteden et al. 2016, 2017; Thorpe and Sunderland 2012; Gabbett 2016; Malone et al. 2017.</div>
  </div>
  <div class="card"><div class="head"><div><div class="eyebrow">Squad list</div><h2>Roster</h2></div><button class="btn ghost sm" id="addP">Add player</button></div>
    <table class="table">${roster}</table>
    <div class="note" style="margin-top:10px">Hidden players keep their history and can be restored.</div>
  </div>`;
  document.getElementById("expJ").onclick=()=>download("AEK_CK_backup_"+todayISO()+".json",JSON.stringify(S,null,1),"application/json");
  document.getElementById("expC").onclick=()=>{
    const pm=Object.fromEntries(S.players.map(p=>[p.id,p]));
    let csv="date;number;player;position;ck_UL;activity;baseline;pct_of_baseline;status\n";
    S.tests.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{const p=pm[t.pid]||{}; const b=baselineOf(t.pid).v; const pc=b?t.val/b:null; const stt=pc==null?"":pc>=S.settings.high?"HIGH":pc>=S.settings.elev?"ELEVATED":"NORMAL";
      csv+=[t.date,p.num||"",p.name||"",p.pos||"",Math.round(t.val),t.act,b?Math.round(b):"",pc!=null?Math.round(pc*100):"",stt].join(";")+"\n";});
    download("AEK_CK_samples_"+todayISO()+".csv","﻿"+csv,"text/csv");
  };
  document.getElementById("sBy").onchange=e=>{S.settings.by=e.target.value.trim();save();};
  document.getElementById("expS").onclick=()=>{
    const snap=JSON.parse(JSON.stringify(S)); snap.exportedAt=Date.now(); snap.exportedBy=S.settings.by||""; delete snap.absorbedSnapshot;
    const json=JSON.stringify(snap).replace(/<\//g,"<\\/");
    const el=document.getElementById("aekck-data"); const prev=el.textContent; el.textContent=json;
    const html="<!doctype html>\n"+document.documentElement.outerHTML; el.textContent=prev;
    download("AEK_CK_"+todayISO()+(snap.exportedBy?"_"+snap.exportedBy.replace(/\s+/g,"_"):"")+".html",html,"text/html");
    toast("Snapshot ready to share");
  };
  document.getElementById("impJ").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{
      let txt=rd.result, o=null;
      if(/^\s*</.test(txt)){ const m=txt.match(/<script id="aekck-data" type="application\/json">([\s\S]*?)<\/script>/); if(!m||!m[1].trim()) throw 0; o=JSON.parse(m[1].replace(/<\\\//g,"</")); }
      else o=JSON.parse(txt);
      if(!o||!o.players||!Array.isArray(o.tests)) throw 0;
      const r=mergeInto(S,o); if(o.exportedAt) S.absorbedSnapshot=Math.max(S.absorbedSnapshot||0,o.exportedAt); save(); render(); toast("Merged: "+r.added+" new, "+r.updated+" updated");
    }catch(err){ toast("Not a valid snapshot or backup"); } }; rd.readAsText(f); e.target.value=""; };
  document.getElementById("wipe").onclick=()=>{ if(confirm("Delete ALL samples and baselines on this device? Roster stays.")){ S.tests=[]; S.baseline={}; save(); render(); toast("Cleared"); } };
  const setT=()=>{ const e=parseFloat(document.getElementById("sElev").value), h=parseFloat(document.getElementById("sHigh").value); if(e>=1&&h>e){ S.settings.elev=e; S.settings.high=h; save(); toast("Thresholds saved"); } else toast("High must be above Elevated"); };
  document.getElementById("sElev").onchange=setT; document.getElementById("sHigh").onchange=setT;
  document.querySelectorAll("[data-num]").forEach(i=>i.onchange=()=>{S.players.find(p=>p.id===i.dataset.num).num=i.value.trim();save();});
  document.querySelectorAll("[data-name]").forEach(i=>i.onchange=()=>{const p=S.players.find(x=>x.id===i.dataset.name); if(i.value.trim()) p.name=i.value.trim(); save();});
  document.querySelectorAll("[data-pos]").forEach(i=>i.onchange=()=>{S.players.find(p=>p.id===i.dataset.pos).pos=i.value;save();});
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const p=S.players.find(x=>x.id===b.dataset.tog); p.active=p.active===false?true:false; save(); render();});
  document.getElementById("addP").onclick=()=>{ const n=prompt("Player name"); if(n&&n.trim()){ S.players.push({id:uid(),num:"",name:n.trim(),pos:"MID",active:true}); save(); render(); } };
}
function download(name,content,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

/* ============ BOOT ============ */
applyLook();
if(!S.tests.length && !Object.keys(S.baseline).length) route="baseline";
render();
if(bootMsg) setTimeout(()=>toast(bootMsg),400);
</script>
</body>
