<title>AEK CK &amp; HRV Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AEK CK">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<script id="aekck-data" type="application/json"></script>
<script src="config.js"></script>
<style>
/* Layout: dark rail with CK and HRV sections, one scrolling 12-column board, bottom tabs on a phone. */
:root{
  --bg:#F1F0E8; --surface:#FFFFFF; --surface2:#ECEBE2; --surface3:#E2E1D6; --line:#D9D7CB;
  --fg:#111111; --muted:#6B6B64; --accent:#FFCC00; --accent2:#FFB800; --accent-ink:#111111;
  --good:#1E9B49; --warn:#C27C08; --bad:#D3352F; --info:#3E6FC4; --sil:#D4D2C7; --sidebg:#111111;
  --shadow:0 10px 30px rgba(17,17,17,.08), 0 1px 2px rgba(17,17,17,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#151515; --surface2:#1D1D1D; --surface3:#262626; --line:#2B2B2B;
    --fg:#F5F4EE; --muted:#9C9C94; --good:#3FD070; --warn:#F3B13C; --bad:#F0514B; --info:#7AA6F0;
    --sil:#262626; --sidebg:#000000;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#151515; --surface2:#1D1D1D; --surface3:#262626; --line:#2B2B2B;
  --fg:#F5F4EE; --muted:#9C9C94; --good:#3FD070; --warn:#F3B13C; --bad:#F0514B; --info:#7AA6F0;
  --sil:#262626; --sidebg:#000000;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.6); color-scheme:dark;
}
body[data-look="light"]{
  --bg:#F1F0E8; --surface:#FFFFFF; --surface2:#ECEBE2; --surface3:#E2E1D6; --line:#D9D7CB;
  --fg:#111111; --muted:#6B6B64; --good:#1E9B49; --warn:#C27C08; --bad:#D3352F; --info:#3E6FC4;
  --sil:#D4D2C7; --sidebg:#111111;
  --shadow:0 10px 30px rgba(17,17,17,.08), 0 1px 2px rgba(17,17,17,.06); color-scheme:light;
}
body[data-look="dark"]{
  --bg:#0A0A0A; --surface:#151515; --surface2:#1D1D1D; --surface3:#262626; --line:#2B2B2B;
  --fg:#F5F4EE; --muted:#9C9C94; --good:#3FD070; --warn:#F3B13C; --bad:#F0514B; --info:#7AA6F0;
  --sil:#262626; --sidebg:#000000;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* shell */
.app{height:100%;display:flex;width:100%}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.mono{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:15px;flex:none}
.who{flex:1;min-width:0}
.who .name{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.who .date{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.look{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.look svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.view{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
.view>*{grid-column:span 12;min-width:0}
.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tabs button svg,.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg)}
.tabs button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.dotn{position:absolute;top:7px;right:calc(50% - 19px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:248px;flex:none;background:var(--sidebg);color:#F5F4EE;padding:24px 18px 18px;gap:2px;height:100%}
  .side .brand{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;padding:4px 6px 0}
  .side .brand .mono{width:46px;height:46px;font-size:16px}
  .side .brand .t{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase}
  .side .brand .t span{color:var(--accent)}
  .side nav{overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .side .sect{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#85847C;font-weight:800;padding:14px 14px 5px}
  .side .sect.first{padding-top:0}
  .navbtn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;color:#B9B8AF;text-align:left;width:100%;position:relative}
  .navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
  .navbtn.on{background:var(--accent);color:var(--accent-ink)}
  .navbtn .dotn{position:static;margin-left:auto;box-shadow:none}
  .side .spacer{flex:1}
  .side .foot{font-size:11px;color:#B9B8AF;letter-spacing:.08em;text-transform:uppercase;padding:0 6px;line-height:1.5}
  .tabs{display:none}
  .top{padding-left:28px;padding-right:28px;padding-block:16px}
  .top .mono,.top .crest{display:none}
  .top .who .name{font-size:30px}
  .scroll{padding-left:28px;padding-right:28px;padding-block:22px 40px}
  .view{gap:18px}
  .c6{grid-column:span 6!important}.c4{grid-column:span 4!important}.c8{grid-column:span 8!important}.c3{grid-column:span 3!important}
}
@media (min-width:1400px){.scroll{padding-left:40px;padding-right:40px}.view{gap:22px}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2{font-size:26px;font-weight:800;margin-top:3px}
.view.enter>.card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.view.enter>.card:nth-child(2){animation-delay:.05s}.view.enter>.card:nth-child(3){animation-delay:.1s}.view.enter>.card:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:22px 20px}
.hero .eyebrow{color:rgba(0,0,0,.6)}
.hero h1{font-size:40px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:8px 0 0;font-size:14px;color:rgba(0,0,0,.75);max-width:52ch}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.pill.y{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.k{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.g{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.w{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.r{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pill.b{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.pill.sm{padding:3px 8px;font-size:10.5px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.k4{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--surface2);border-radius:14px;padding:12px 12px 10px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi.y{background:var(--accent);color:var(--accent-ink)}.kpi.y .k{color:rgba(0,0,0,.6)}
.kpi.r{background:color-mix(in srgb,var(--bad) 16%,transparent)}.kpi.r .v{color:var(--bad)}
.kpi.w{background:color-mix(in srgb,var(--warn) 16%,transparent)}.kpi.w .v{color:var(--warn)}
.kpi.b{background:color-mix(in srgb,var(--info) 16%,transparent)}.kpi.b .v{color:var(--info)}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--muted);transition:all .15s}
.seg button.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin-top:12px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:10px 14px;font-size:16px;width:auto;margin-top:0}
.btn[disabled]{opacity:.5;cursor:default}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2>*{flex:1;min-width:120px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inp{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600;width:100%;color:var(--fg)}
.inp.num{font-family:var(--display);font-size:20px;text-align:center;font-weight:800}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.bar{height:8px;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar i.w{background:var(--warn)}.bar i.r{background:var(--bad)}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.35}
.bar b{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 30%,transparent)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--fg)}

/* player list */
.plist{display:flex;flex-direction:column;margin:0 -18px -18px}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);text-align:left;width:100%}
.prow:hover{background:var(--surface2)}
.prow .n{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);text-align:center}
.prow .nm{font-weight:700;font-size:15.5px;line-height:1.1}
.prow .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.prow .sub .bar{max-width:120px;min-width:70px}
.prow .val{font-family:var(--display);font-weight:900;font-size:22px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.prow .val small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.prow.dim{opacity:.55}

/* portraits: the shirt number stays underneath, so a missing photo still names the player */
.av{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;flex:none}
.av span{font-family:var(--display);font-weight:800;font-size:14px;color:var(--muted);line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.big{width:62px;height:62px;border-width:2px}
.av.big span{font-size:24px}
.crest{width:38px;height:38px;object-fit:contain;flex:none}
.side .brand .crest{width:52px;height:52px}

/* entry grids */
.erow{display:grid;grid-template-columns:34px 1fr 92px 86px;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.erow .n,.hrow .n{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);text-align:center}
.erow .nm,.hrow .nm{font-weight:700;font-size:15px;min-width:0}
.erow .nm small,.hrow .nm small{display:block;font-weight:600;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .inp,.hrow .inp{padding:8px 6px}
.erow select.inp{padding:8px 26px 8px 8px;font-size:13px;font-weight:700}
.erow.filled .nm,.hrow.filled .nm{color:var(--fg)}
.erow.flag-r .inp.num,.hrow.flag-r .inp.num{border-color:var(--bad);color:var(--bad)}
.erow.flag-w .inp.num,.hrow.flag-w .inp.num{border-color:var(--warn);color:var(--warn)}
.hrow{display:grid;grid-template-columns:34px 1fr 86px 68px;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.hhead{display:grid;grid-template-columns:34px 1fr 86px 68px;gap:8px;padding:4px 18px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.hhead span:nth-child(2){text-align:left}

/* baseline grid */
.brow{display:grid;grid-template-columns:34px 1fr repeat(4,56px) 70px;gap:6px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.brow .inp{padding:8px 4px;font-size:16px}
.brow .res{font-family:var(--display);font-weight:900;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.brow .res small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brow .nm{font-weight:700;font-size:15px;line-height:1.1;min-width:0}
.brow .nm small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.bhead{display:grid;grid-template-columns:34px 1fr repeat(4,56px) 70px;gap:6px;padding:4px 18px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.bhead span:nth-child(2){text-align:left}
@media (max-width:480px){
  .av{width:28px;height:28px}
  .av span{font-size:12px}
  .brow,.bhead{grid-template-columns:28px 1fr repeat(4,46px) 58px;gap:4px;padding-inline:12px}
  .brow .inp{font-size:14px;padding:8px 2px}
  .erow{grid-template-columns:28px 1fr 78px 80px;padding-inline:12px}
  .hrow,.hhead{grid-template-columns:28px 1fr 76px 62px;gap:6px;padding-inline:12px}
}

/* chart */
.chartwrap{position:relative;width:100%}
.chartwrap svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table td.num,.table th.num{text-align:right;font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.table tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto}
.mini{padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700}
.mini.r{color:var(--bad)}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:20;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.note b{color:var(--fg)}
.stepper{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.stepper:first-of-type{border-top:0}
.stepper .d{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:900;display:grid;place-items:center;flex:none;font-size:15px}
.stepper .d.y{background:var(--accent);color:var(--accent-ink)}
.stepper b{display:block;font-family:var(--display);font-size:18px;font-weight:800}
.stepper span{font-size:13px;color:var(--muted)}

/* live sync */
.sbtn{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 9px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:none}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--sil);flex:none;display:inline-block;transition:background .2s}

<script>
/* ============ DATA ============ */
const BUILD="2026-11-09a";
const KEY="aekck:v2", LKEY="aekck:look";
const ACTS=[["FG","Full game"],["PG","Partial game"],["PG+T","Partial game + training"],["TR","Training session"],["OFF","Day off"],["TEST","Isolated re-test"],["INJ","Injured / unavailable"]];
const ACT_LABEL=Object.fromEntries(ACTS);
const ACT_COLOR={FG:"var(--fg)",PG:"#5B5B55",["PG+T"]:"#8A8A80",TR:"var(--accent2)",OFF:"var(--good)",TEST:"var(--info)",INJ:"var(--bad)"};
const POS=[["SUP","Supine"],["SIT","Seated"]];
const ROSTER=[
 ["","Strakosha","GK"],["","Brignoli","GK"],["","Balamotis","GK"],
 ["2","Moukoudi","DEF"],["3","Pilios","DEF"],["5","Alexiou","DEF"],["6","Kairinen","MID"],["7","Kutesa","FWD"],
 ["8","Gacinovic","MID"],["9","Jovic","FWD"],["10","Zubkov","FWD"],["11","Koita","FWD"],["12","Rota","DEF"],
 ["14","Majer","MID"],["15","Georgiev","DEF"],["16","Ariaga","DEF"],["17","Kaloskamis","FWD"],["18","Marin","MID"],
 ["20","Mantalos","MID"],["21","Vida","DEF"],["25","Varga","FWD"],["27","Vitalis","FWD"],["44","Relvas","DEF"],
 ["57","Christakopoulos","MID"],["80","Sahabo","MID"],["90","Zine","FWD"],["99","Argyriou","FWD"],["","Likogiannis","DEF"]
];
const DEF_SET={elev:1.5,high:2.0,hrvSwc:0.5,hrvWin:28,hrvRoll:7,cvHigh:8,scale:20,by:""};
function freshState(){
  return {
    v:2,
    players:ROSTER.map((r,i)=>({id:"p"+(i+1),num:r[0],name:r[1],pos:r[2],active:true,ts:0})),
    baseline:{},   // pid -> {s:[4], manual, ts}
    tests:[],      // {id,date,pid,val,act,note,ts,by}
    hrv:[],        // {id,date,pid,rmssd,hr,pos,note,ts,by}
    settings:Object.assign({},DEF_SET)
  };
}
let bootMsg=null, LOOK="auto";
let S=load();
function load(){
  let L=null;
  try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); if(o&&o.players) L=migrate(o);}}catch(e){}
  try{LOOK=localStorage.getItem(LKEY)||"auto";}catch(e){}
  const E=embeddedData();
  if(E&&!L){ L=migrate(E); L.absorbedSnapshot=E.exportedAt||0; bootMsg="Snapshot loaded"+(E.exportedBy?" from "+E.exportedBy:""); }
  else if(E&&L&&(E.exportedAt||0)>(L.absorbedSnapshot||0)){ const r=mergeInto(L,E); L.absorbedSnapshot=E.exportedAt; bootMsg="Snapshot merged: "+r.added+" new, "+r.updated+" updated"; }
  return L||freshState();
}
function migrate(o){
  o.settings=Object.assign({},DEF_SET,o.settings||{});
  o.baseline=o.baseline||{}; o.tests=o.tests||[]; o.hrv=o.hrv||[];
  o.players=(o.players||freshState().players).map(p=>Object.assign({ts:0},p));
  o.tests.forEach(t=>{ if(!t.id) t.id=t.date+"_"+t.pid; });
  o.hrv.forEach(h=>{ if(!h.id) h.id=h.date+"_"+h.pid; });
  delete o.sync; delete o.token;
  return o;
}
function save(){ S.savedAt=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function embeddedData(){ try{ const el=document.getElementById("aekck-data"); const txt=el&&el.textContent.trim(); if(txt){ const o=JSON.parse(txt); if(o&&o.players) return o; } }catch(e){} return null; }
function mergeInto(L,E){
  const pm=Object.fromEntries(L.players.map(p=>[p.id,p]));
  (E.players||[]).forEach(p=>{ if(pm[p.id]) Object.assign(pm[p.id],p); else L.players.push(p); });
  Object.entries(E.baseline||{}).forEach(([pid,b])=>{ const l=L.baseline[pid]; const has=x=>x&&((x.s||[]).some(v=>v>0)||x.manual>0);
    if(!l||(b.ts||0)>(l.ts||0)||(!has(l)&&has(b))) L.baseline[pid]=b; });
  let added=0,updated=0;
  const pair=(arr,inc)=>{ (inc||[]).forEach(t=>{ const l=arr.find(x=>x.pid===t.pid&&x.date===t.date);
    if(!l){ arr.push(t); added++; } else if((t.ts||0)>(l.ts||0)){ Object.assign(l,t); updated++; } }); };
  pair(L.tests,E.tests); pair(L.hrv,E.hrv);
  if(E.settings){ L.settings.elev=E.settings.elev||L.settings.elev; L.settings.high=E.settings.high||L.settings.high; }
  return {added,updated};
}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtD=iso=>{if(!iso)return"";const a=iso.split("-");return a[2]+"."+a[1]+"."+a[0].slice(2);};
const fmtDL=iso=>{if(!iso)return"";const a=iso.split("-");return a[2]+"."+a[1]+"."+a[0];};
const dAdd=(iso,k)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+k);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sdev=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));};
const r0=x=>x==null?"":Math.round(x);
const r1=x=>x==null?"":(Math.round(x*10)/10).toFixed(1);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Portrait file is the surname in lower case: photos/pilios.webp. Rename a player and the
   photo follows; a player without one keeps the number badge. */
const slug=n=>String(n||"").toLowerCase().replace(/[^a-z]/g,"");
function av(p,cls){
  return '<div class="av '+(cls||"")+'"><span>'+esc(p.num||p.pos)+'</span>'
    +'<img src="photos/'+slug(p.name)+'.webp?v='+BUILD+'" alt="" decoding="async"></div>';
}

    im.addEventListener("error",()=>im.remove(),{once:true});

}
function crestInit(){
  [["brandCrest","brandMono"],["topCrest","topMono"],["gateCrest","gateMono"]].forEach(([ci,mi])=>{
    const im=document.getElementById(ci), mo=document.getElementById(mi);

/* ============ CK MODEL ============ */
function playerTests(pid){ return S.tests.filter(t=>t.pid===pid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
function baselineOf(pid){
  const b=S.baseline[pid]||{s:[],manual:null};
  if(b.manual!=null&&b.manual>0) return {v:b.manual,src:"manual"};
  const s=(b.s||[]).filter(x=>typeof x==="number"&&x>0);
  if(s.length) return {v:mean(s),src:"rested",n:s.length};
  const t=playerTests(pid);
  const off=t.filter(x=>x.act==="OFF").map(x=>x.val); if(off.length) return {v:mean(off),src:"est. day off",n:off.length};
  const tr=t.filter(x=>x.act==="TR").map(x=>x.val);   if(tr.length)  return {v:mean(tr),src:"est. training",n:tr.length};
  return {v:null,src:"none"};
}
function statusOf(pid){
  const t=playerTests(pid); const last=t.length?t[t.length-1]:null;
  const b=baselineOf(pid);
  let pct=null,st="none";
  if(last&&b.v){ pct=last.val/b.v; st=pct>=S.settings.high?"HIGH":pct>=S.settings.elev?"ELEVATED":"NORMAL"; }
  else if(last) st="nobase";
  return {last,base:b,pct,st,tests:t};
}
const pillCls={HIGH:"r",ELEVATED:"w",NORMAL:"g",none:"",nobase:"y"};
const stLabel={HIGH:"High",ELEVATED:"Elevated",NORMAL:"Normal",none:"No data",nobase:"No baseline"};
function avgByAct(t,codes){ const v=t.filter(x=>codes.includes(x.act)).map(x=>x.val); return v.length?mean(v):null; }
/* Team-sheet order everywhere: keepers first, then defence, midfield, attack, and inside
   each line by shirt number. A player without a number goes last in his line. */
const POSORD={GK:0,DEF:1,MID:2,FWD:3};
function squadCmp(a,b){
  const pa=POSORD[a.pos]==null?4:POSORD[a.pos], pb=POSORD[b.pos]==null?4:POSORD[b.pos];
  if(pa!==pb) return pa-pb;
  const na=parseInt(a.num,10), nb=parseInt(b.num,10);
  const ia=isNaN(na)?999:na, ib=isNaN(nb)?999:nb;
  if(ia!==ib) return ia-ib;
  return String(a.name||"").localeCompare(String(b.name||""));
}
function activePlayers(){ return S.players.filter(p=>p.active!==false).sort(squadCmp); }
function lastDrawDate(){ return S.tests.length?S.tests.map(t=>t.date).sort().pop():null; }

/* ============ HRV MODEL ============
   lnRMSSD is the working unit: RMSSD is skewed, its log is not. The score shown on
   screen is 20 x lnRMSSD, the scale most HRV apps print, so the numbers stay familiar.
   Reference = this player's own rolling window; the normal band is mean +/- 0.5 SD
   (the smallest worthwhile change). One day under the band is noise, two in a row or a
   7-day mean under it is the signal. CV of the last 7 days flags an unstable week. */
function hrvAll(pid){ return S.hrv.filter(h=>h.pid===pid&&h.rmssd>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
const lnv=h=>Math.log(h.rmssd);
const sc=v=>v==null?null:v*(S.settings.scale||20);
function lastHrvDate(){ return S.hrv.length?S.hrv.map(h=>h.date).sort().pop():null; }
function hrvStat(pid,onDate){
  const all=hrvAll(pid);
  const d0=onDate||lastHrvDate()||todayISO();
  const upto=all.filter(h=>h.date<=d0);
  const last=upto.length?upto[upto.length-1]:null;
  const prev=upto.length>1?upto[upto.length-2]:null;
  const winFrom=dAdd(d0,-(S.settings.hrvWin||28));
  const bw=upto.filter(h=>h.date>=winFrom&&h.date<(last?last.date:d0)).map(lnv);
  const rollFrom=dAdd(last?last.date:d0,-(S.settings.hrvRoll||7)+1);
  const rl=upto.filter(h=>h.date>=rollFrom).map(lnv);
  const roll=rl.length>=3?mean(rl):null;
  const cv=rl.length>=3?sdev(rl)/mean(rl)*100:null;
  let m=null,sd=null,lo=null,hi=null;
  if(bw.length>=7){ m=mean(bw); sd=sdev(bw); const sw=(S.settings.hrvSwc||0.5)*sd; lo=m-sw; hi=m+sw; }
  const v=last?lnv(last):null;
  let st="none";
  if(!last) st="none";
  else if(lo==null) st="build";
  else{
    const below=v<lo, pBelow=prev?lnv(prev)<lo:false;
    if(below&&(pBelow||(roll!=null&&roll<lo))) st="LOW";
    else if(below) st="WATCH";
    else if(v>hi) st="ABOVE";
    else st="OK";
  }
  return {last,prev,v,roll,cv,m,sd,lo,hi,st,n:bw.length,nRoll:rl.length,
          unstable:cv!=null&&cv>(S.settings.cvHigh||8),all:upto};
}
const hrvCls={LOW:"r",WATCH:"w",OK:"g",ABOVE:"b",build:"y",none:""};
const hrvLabel={LOW:"Low",WATCH:"Watch",OK:"In band",ABOVE:"Above band",build:"Building",none:"No data"};
function hrvBar(h){
  if(h.lo==null||h.v==null) return "";
  const m=h.m, s=h.sd||1, lo=m-3*s, span=6*s;
  const pc=x=>Math.max(0,Math.min(100,(x-lo)/span*100));
  return '<div class="bar"><b style="left:'+pc(h.lo)+'%;width:'+Math.max(2,pc(h.hi)-pc(h.lo))+'%"></b><u style="left:'+pc(h.v)+'%"></u></div>';
}
/* CK and HRV together: the pair is what makes a day worth acting on. */
function crossRead(ck,h){
  const ckHot=ck.st==="HIGH"||ck.st==="ELEVATED", hrvDown=h.st==="LOW"||h.st==="WATCH";
  if(ckHot&&hrvDown) return {cls:"r",txt:"Muscle damage still high and the autonomic response has not settled. Treat today as recovery and re-test before any high-speed work."};
  if(ckHot&&h.st==="OK") return {cls:"w",txt:"CK is up but HRV sits in his own band. Usual response to the load, worth a second CK sample rather than a change of plan."};
  if(!ckHot&&hrvDown) return {cls:"w",txt:"CK has come down while HRV is under his band. Look outside training first: sleep, illness, travel, stress."};
  if(ck.st==="NORMAL"&&h.st==="OK") return {cls:"g",txt:"Both markers sit where this player normally sits. Nothing to hold back."};
  if(h.st==="ABOVE") return {cls:"b",txt:"HRV above his own band. Usually a well-recovered day, but keep an eye on it when it comes with heavy fatigue reports."};
  return {cls:"",txt:"Not enough samples yet to read the two markers together."};
}

/* ============ LIVE (shared store) ============
   Everything staff types lands in the artifact store: one document per day per marker,
   each player merged in on his own key, so two people entering at the same time do not
   overwrite each other. Without the store (file opened on its own) the app keeps working
   on this device only. */
const LIVE={mode:"off",db:null,user:null,me:null,can:null,subs:[],state:"off",at:0,err:"",slow:false,timer:null,name:""};
const NAMES={};
/* Keys the shared store is known to hold already, so a reconnect does not push them back
   and rewrite who entered them. */
const SEEN={ck:{},hrv:{},base:{},squad:{}};
const NKEY="aekck:net";
let outbox={}, flushTmr=null, flushing=false, needRender=false, pollTmr=null;
const myId=()=>LIVE.mode==="net"?(LIVE.name||"staff"):((LIVE.me&&LIVE.me.id)||"");
function nameOf(id){ if(!id) return ""; if(LIVE.mode==="net") return id; if(id===myId()) return "you"; return NAMES[id]||"staff"; }
function loadNet(){ try{ return Object.assign({url:"",pin:"",name:"",since:0},JSON.parse(localStorage.getItem(NKEY)||"{}")); }catch(e){ return {url:"",pin:"",name:"",since:0}; } }
function saveNet(patch){ const n=Object.assign(loadNet(),patch||{}); try{ localStorage.setItem(NKEY,JSON.stringify(n)); }catch(e){} return n; }
function netUrl(){ const n=loadNet(); return (n.url||(window.AEK_CK&&window.AEK_CK.url)||"").trim(); }
function setState(st,err){ LIVE.state=st; LIVE.err=err||""; updChip(); }
function updChip(){
  const b=document.getElementById("syncBtn"), d=document.getElementById("sdot"), t=document.getElementById("syncTxt");
  if(!b) return;
  const q=Object.keys(outbox).reduce((a,k)=>a+Object.keys(outbox[k]||{}).length,0);
  let cls="",txt="Local";
  if(LIVE.state==="off"){ cls=""; txt="This device"; }
  else if(LIVE.state==="err"){ cls="err"; txt="Not saved"; }
  else if(q||flushing){ cls="wait"; txt="Saving"; }
  else if(LIVE.state==="wait"){ cls="wait"; txt=LIVE.slow?"Waiting":"Connecting"; }
  else { cls="ok"; txt="Live"; }
  b.classList.remove("hidden");
  d.className="sdot "+cls;
  t.textContent=txt;
  b.title=LIVE.state==="off"
    ? "Not connected: values stay on this device"
    : (LIVE.state==="err"?("Last write failed ("+LIVE.err+"). Retrying."):("Shared with the staff"+(LIVE.at?" \u00B7 last update "+hhmm(LIVE.at):"")));
}
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
async function initLive(){
  if(window.claude&&window.claude.use){ await initDb(); return; }
  if(netUrl()){ await initNet(); return; }
  setState("off");
}
/* --- transport 2: own Apps Script behind a staff PIN (GitHub Pages copy) --- */
async function api(action,payload){
  const url=netUrl();
  if(!url) throw new Error("nourl");
  const body=Object.assign({action:action,key:loadNet().pin},payload||{});
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return await res.json();
}
async function initNet(){
  LIVE.mode="net";
  if(!loadNet().pin){ setState("off"); showGate(""); return; }
  setState("wait");
  let r=null;
  try{ r=await api("auth",{}); }catch(e){ setState("err","net"); render(); return; }
  if(!r||!r.ok){ saveNet({pin:"",name:""}); setState("off"); showGate(r&&r.error==="pin"?"That PIN is not on the staff list.":"Could not reach the sheet."); render(); return; }
  LIVE.name=r.name||"staff"; saveNet({name:LIVE.name});
  hideGate();
  await pullNet(true);
  clearInterval(pollTmr);
  pollTmr=setInterval(()=>{ if(document.visibilityState==="visible"&&!flushing&&!Object.keys(outbox).length) pullNet(false); },20000);
  render();
}
async function pullNet(first){
  if(LIVE.mode!=="net") return;
  const n=loadNet();
  let r=null;
  try{ r=await api("pull",{since:first?0:Math.max(0,(n.since||0)-2000)}); }catch(e){ setState("err","net"); return; }
  if(!r||!r.ok){ if(r&&r.error==="pin"){ badPin(); return; } setState("err",(r&&r.error)||"pull"); return; }
  let cnt=0; const who={};
  (r.days||[]).forEach(d=>{ cnt+=absorbDay(String(d.coll),String(d.date),{v:d.v},who); });
  (r.base||[]).forEach(b=>{ cnt+=absorbBaseRec(b); });
  (r.squad||[]).forEach(p=>{ cnt+=absorbSquadRec(p); });
  if(r.cfg) cnt+=absorbCfg(r.cfg);
  saveNet({since:Number(r.now)||0});
  LIVE.at=Date.now(); setState("on");
  if(cnt){ save(); announce(who,cnt,""); liveRender(); }
}
function showGate(msg){
  let g=document.getElementById("gate");
  if(!g){ g=document.createElement("div"); g.id="gate"; g.className="gate"; document.body.appendChild(g); }
  g.innerHTML='<div class="box"><div class="mono" id="gateMono">AEK</div><img class="crest gatecrest hidden" id="gateCrest" src="crest.webp?v='+BUILD+'" alt="AEK Athens FC"><h1>CK &amp; HRV<br>Monitor</h1>'
    +'<div class="note" style="margin-top:10px">Staff sign-in. What you enter is shared with the performance staff straight away, and whatever they enter shows up here.</div>'
    +'<div class="field" style="margin-top:18px"><label>Staff PIN</label><input class="inp" type="password" id="gPin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>'
    +'<button class="btn" id="gIn">Sign in</button>'
    +'<button class="btn ghost sm" style="margin-top:10px;width:100%" id="gOff">Work on this device only</button>'
    +(msg?'<div class="note" style="margin-top:12px;color:var(--bad)">'+esc(msg)+"</div>":"")
    +'<div class="note" style="margin-top:14px;font-size:11px">Version '+BUILD+"</div></div>";
  crestInit();
  const inp=document.getElementById("gPin");
  const go=()=>{ const p=(inp.value||"").trim(); if(!p){ showGate("Type the PIN first."); return; } saveNet({pin:p}); initNet(); };
  document.getElementById("gIn").onclick=go;
  inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
  document.getElementById("gOff").onclick=()=>{ hideGate(); LIVE.mode="off"; setState("off"); render(); };
  inp.focus();
}
function hideGate(){ const g=document.getElementById("gate"); if(g) g.remove(); }
/* The PIN was changed in the Staff sheet while this device was signed in: ask again rather
   than sitting on a red dot. Anything still unsent stays in the queue and goes after sign-in. */
function badPin(){
  clearInterval(pollTmr);
  saveNet({pin:"",name:"",since:0});
  LIVE.mode="net"; LIVE.name="";
  setState("off");
  showGate("This PIN is no longer on the staff list. Ask for the new one.");
}
async function initDb(){
  LIVE.mode="db";
  setState("wait");
  try{ LIVE.db=await window.claude.use("db"); }catch(e){ LIVE.db=null; }
  try{ LIVE.user=await window.claude.use("user"); }catch(e){ LIVE.user=null; }
  if(LIVE.user){
    try{ LIVE.me=await LIVE.user.me(); }catch(e){}
    try{ LIVE.can=await LIVE.user.can("data.write"); }catch(e){}
  }
  if(!LIVE.db){ setState("off"); render(); return; }
  LIVE.timer=setTimeout(()=>{ LIVE.slow=true; if(LIVE.state==="wait") updChip(); },10000);
  const d=LIVE.db;
  try{
    LIVE.subs.push(d.collection("ck").orderBy("date","desc").limit(200).onSnapshot(s=>onDays("ck",s),onErr));
    LIVE.subs.push(d.collection("hrv").orderBy("date","desc").limit(200).onSnapshot(s=>onDays("hrv",s),onErr));
    LIVE.subs.push(d.collection("base").onSnapshot(onBase,onErr));
    LIVE.subs.push(d.collection("squad").onSnapshot(onSquad,onErr));
    LIVE.subs.push(d.doc("cfg/app").onSnapshot(onCfg,onErr));
  }catch(e){ setState("err",(e&&e.code)||"subscribe"); }
  render();
}
function onErr(e){ setState("err",(e&&e.code)||"error"); }
function settled(snap){
  if(snap&&snap.metadata&&snap.metadata.fromCache===false){
    clearTimeout(LIVE.timer); LIVE.slow=false; LIVE.at=Date.now();
    if(LIVE.state!=="err") setState("on");
  }
  updChip();
}
function onDays(coll,snap){
  let n=0; const who={};
  (snap.docChanges?snap.docChanges():[]).forEach(ch=>{
    const date=ch.doc.id;
    if(ch.type==="removed"){ n+=dropDate(coll,date); return; }
    n+=absorbDay(coll,date,ch.doc.data()||{},who);
  });
  settled(snap);
  if(n){ save(); announce(who,n,coll); liveRender(); }
}
function dropDate(coll,date){
  const arr=coll==="ck"?S.tests:S.hrv; const before=arr.length;
  const keep=arr.filter(x=>x.date!==date);
  if(coll==="ck") S.tests=keep; else S.hrv=keep;
  return before-keep.length;
}
function absorbDay(coll,date,body,who){
  const arr=coll==="ck"?S.tests:S.hrv; const v=body.v||{}; let n=0;
  Object.keys(v).forEach(pid=>{
    const r=v[pid]; if(!r||typeof r!=="object") return;
    SEEN[coll][date+"|"+pid]=1;
    const ts=Number(r.ts)||0;
    const i=arr.findIndex(x=>x.date===date&&x.pid===pid);
    const cur=i>=0?arr[i]:null;
    if(cur&&(Number(cur.ts)||0)>ts) return;
    if(r.del){ if(cur){ arr.splice(i,1); n++; } return; }
    const rec=coll==="ck"
      ? {id:r.id||date+"_"+pid,date:date,pid:pid,val:Number(r.val)||0,act:r.act||"TR",note:r.note||"",ts:ts,by:r.by||""}
      : {id:r.id||date+"_"+pid,date:date,pid:pid,rmssd:Number(r.rmssd)||0,hr:r.hr==null?null:Number(r.hr),pos:r.pos||"",note:r.note||"",ts:ts,by:r.by||""};
    if(coll==="ck"&&!(rec.val>0)) return;
    if(coll==="hrv"&&!(rec.rmssd>0)) return;
    if(cur&&JSON.stringify(cur)===JSON.stringify(rec)) return;
    if(cur) arr[i]=rec; else arr.push(rec);
    n++; if(rec.by&&rec.by!==myId()) who[rec.by]=(who[rec.by]||0)+1;
  });
  return n;
}
function absorbBaseRec(b){
  const pid=String(b.pid), cur=S.baseline[pid], ts=Number(b.ts)||0;
  SEEN.base[pid]=1;
  if(cur&&(Number(cur.ts)||0)>ts) return 0;
  const rec={s:(b.s||[]).map(x=>x==null?null:Number(x)),manual:b.manual==null?null:Number(b.manual),ts:ts,by:b.by||""};
  if(cur&&JSON.stringify(cur)===JSON.stringify(rec)) return 0;
  S.baseline[pid]=rec; return 1;
}
function absorbSquadRec(p){
  const pid=String(p.id), ts=Number(p.ts)||0;
  SEEN.squad[pid]=1;
  const cur=S.players.find(x=>x.id===pid);
  if(cur&&(Number(cur.ts)||0)>=ts) return 0;
  const rec={id:pid,num:String(p.num==null?"":p.num),name:String(p.name||""),pos:p.pos||"MID",active:p.active!==false,ts:ts};
  if(!rec.name) return 0;
  if(cur) Object.assign(cur,rec); else S.players.push(rec);
  return 1;
}
function absorbCfg(b){
  if(!b||(Number(b.ts)||0)<=(Number(S.settings.ts)||0)) return 0;
  ["elev","high","hrvSwc","hrvWin","hrvRoll","cvHigh","scale"].forEach(k=>{ if(b[k]!=null) S.settings[k]=Number(b[k]); });
  S.settings.ts=Number(b.ts)||0; return 1;
}
function onBase(snap){
  let n=0;
  (snap.docChanges?snap.docChanges():[]).forEach(ch=>{
    const pid=ch.doc.id, b=ch.doc.data()||{};
    if(ch.type==="removed"){ if(S.baseline[pid]){ delete S.baseline[pid]; n++; } return; }
    n+=absorbBaseRec(Object.assign({pid:pid},b));
  });
  settled(snap); if(n){ save(); liveRender(); }
}
function onSquad(snap){
  let n=0;
  (snap.docChanges?snap.docChanges():[]).forEach(ch=>{
    if(ch.type==="removed") return;
    n+=absorbSquadRec(Object.assign({id:ch.doc.id},ch.doc.data()||{}));
  });
  settled(snap); if(n){ save(); liveRender(); }
}
function onCfg(snap){
  const b=snap.exists?(snap.data()||{}):null;
  settled(snap);
  if(b&&absorbCfg(b)){ save(); liveRender(); }
}
function announce(who,n,coll){
  const ids=Object.keys(who); if(!ids.length) return;
  resolveNames(ids);
  const total=ids.reduce((a,k)=>a+who[k],0);
  const label=coll==="ck"?"CK ":coll==="hrv"?"HRV ":"";
  toast(total+" new "+label+"value"+(total===1?"":"s")+" from "+(nameOf(ids[0])||"staff"));
}
async function resolveNames(ids){
  if(!LIVE.user) return;
  const miss=ids.filter(i=>i&&!(i in NAMES));
  if(!miss.length) return;
  miss.forEach(i=>{NAMES[i]="";});
  try{
    const ps=await LIVE.user.profiles(miss);
    let ch=false;
    Object.keys(ps||{}).forEach(k=>{ const nm=(ps[k]&&ps[k].name)||""; if(nm){ NAMES[k]=nm; ch=true; } });
    if(ch) liveRender();
  }catch(e){}
}
function liveRender(){
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT)$/.test(a.tagName)&&a.closest("#view")){ needRender=true; return; }
  needRender=false; render();
}
document.addEventListener("focusout",()=>{ if(needRender) setTimeout(()=>{ if(needRender) liveRender(); },120); },true);

/* --- push --- */
function mark(kind,key){
  if(LIVE.mode==="off") return;
  (outbox[kind]=outbox[kind]||{})[key]=1;
  updChip();
  clearTimeout(flushTmr); flushTmr=setTimeout(flush,700);
}
function dayVal(coll,date,pid){
  const arr=coll==="ck"?S.tests:S.hrv;
  const t=arr.find(x=>x.date===date&&x.pid===pid);
  const me=myId();
  if(!t) return {del:1,ts:Date.now(),by:me};
  return coll==="ck"
    ? {id:t.id,val:t.val,act:t.act,note:t.note||"",ts:t.ts||Date.now(),by:t.by||me}
    : {id:t.id,rmssd:t.rmssd,hr:t.hr==null?null:t.hr,pos:t.pos||"",note:t.note||"",ts:t.ts||Date.now(),by:t.by||me};
}
async function writeDay(coll,date,v){
  const ref=LIVE.db.doc(coll+"/"+date);
  const body={date:date,v:v,ts:Date.now()};
  try{ await ref.update(body); }
  catch(e){ if(e&&(e.code==="invalid_argument"||e.code==="transform_error")) await ref.set(body); else throw e; }
}
function jobDays(job){
  const days=[];
  ["ck","hrv"].forEach(coll=>{
    const byDate={};
    Object.keys(job[coll]||{}).forEach(k=>{ const i=k.indexOf("|"); const d=k.slice(0,i), pid=k.slice(i+1); (byDate[d]=byDate[d]||[]).push(pid); });
    Object.keys(byDate).forEach(date=>{ const v={}; byDate[date].forEach(pid=>{ v[pid]=dayVal(coll,date,pid); }); days.push({coll:coll,date:date,v:v}); });
  });
  return days;
}
function markSeen(job){
  ["ck","hrv","base","squad"].forEach(c=>{ Object.keys(job[c]||{}).forEach(k=>{ SEEN[c][k]=1; }); });
}
function cfgOut(){
  const st=S.settings;
  return {elev:st.elev,high:st.high,hrvSwc:st.hrvSwc,hrvWin:st.hrvWin,hrvRoll:st.hrvRoll,cvHigh:st.cvHigh,scale:st.scale,ts:st.ts||Date.now()};
}
async function flushNet(job){
  const base=Object.keys(job.base||{}).map(pid=>{
    const b=S.baseline[pid]||{s:[],manual:null};
    return {pid:pid,s:(b.s||[]).map(x=>x==null?null:x),manual:b.manual==null?null:b.manual,ts:b.ts||Date.now()};
  });
  const squad=Object.keys(job.squad||{}).map(pid=>{
    const p=S.players.find(x=>x.id===pid);
    return p?{id:p.id,num:p.num||"",name:p.name,pos:p.pos,active:p.active!==false,ts:p.ts||Date.now()}:null;
  }).filter(Boolean);
  const payload={days:jobDays(job),base:base,squad:squad};
  if(job.cfg) payload.cfg=cfgOut();
  const r=await api("push",payload);
  if(r&&r.error==="pin"){ badPin(); throw {code:"pin"}; }
  if(!r||!r.ok) throw {code:(r&&r.error)||"push"};
  saveNet({since:Number(r.now)||loadNet().since});
}
async function flush(){
  if(flushing||LIVE.mode==="off") return;
  const job=outbox; outbox={}; flushing=true; updChip();
  try{
    if(LIVE.mode==="net"){ await flushNet(job); markSeen(job); LIVE.at=Date.now(); setState("on"); return; }
    for(const coll of ["ck","hrv"]){
      const byDate={};
      Object.keys(job[coll]||{}).forEach(k=>{ const i=k.indexOf("|"); const d=k.slice(0,i), pid=k.slice(i+1); (byDate[d]=byDate[d]||[]).push(pid); });
      for(const date of Object.keys(byDate)){
        const v={}; byDate[date].forEach(pid=>{ v[pid]=dayVal(coll,date,pid); });
        await writeDay(coll,date,v);
      }
    }
    for(const pid of Object.keys(job.base||{})){
      const b=S.baseline[pid]||{s:[],manual:null};
      await LIVE.db.doc("base/"+pid).set({s:(b.s||[]).map(x=>x==null?null:x),manual:b.manual==null?null:b.manual,ts:b.ts||Date.now(),by:myId()});
    }
    for(const pid of Object.keys(job.squad||{})){
      const p=S.players.find(x=>x.id===pid); if(!p) continue;
      await LIVE.db.doc("squad/"+pid).set({num:p.num||"",name:p.name,pos:p.pos,active:p.active!==false,ts:p.ts||Date.now()});
    }
    if(job.cfg){
      const st=S.settings;
      await LIVE.db.doc("cfg/app").set({elev:st.elev,high:st.high,hrvSwc:st.hrvSwc,hrvWin:st.hrvWin,hrvRoll:st.hrvRoll,cvHigh:st.cvHigh,scale:st.scale,ts:st.ts||Date.now()});
    }
    markSeen(job);
    LIVE.at=Date.now(); setState("on");
  }catch(e){
    Object.keys(job).forEach(c=>{ outbox[c]=Object.assign({},job[c],outbox[c]||{}); });
    if(e&&e.code==="pin") return;
    setState("err",(e&&e.code)||"write");
    clearTimeout(flushTmr); flushTmr=setTimeout(flush,8000);
  }finally{ flushing=false; updChip(); }
}
/* Only what this device has and the shared store does not: work done offline, or the very
   first connection. Anything that came from the store is left alone. */
function pushAllLocal(){
  if(LIVE.mode==="off") return;
  let n=0;
  S.players.forEach(p=>{ if(!SEEN.squad[p.id]){ p.ts=p.ts||Date.now(); mark("squad",p.id); n++; } });
  Object.keys(S.baseline).forEach(pid=>{ if(!SEEN.base[pid]){ mark("base",pid); n++; } });
  S.tests.forEach(t=>{ const k=t.date+"|"+t.pid; if(!SEEN.ck[k]){ mark("ck",k); n++; } });
  S.hrv.forEach(h=>{ const k=h.date+"|"+h.pid; if(!SEEN.hrv[k]){ mark("hrv",k); n++; } });
  if(n) toast(n+" value"+(n===1?"":"s")+" from this device sent to the staff");
}

function summaryText(ld){
  const P=activePlayers();

  const line=x=>(x.p.num?"#"+x.p.num+" ":"")+x.p.name+": "+r0(x.last.val)+" U/L ("+(x.pct!=null?Math.round(x.pct*100)+"% of base":"no base")+", "+x.last.act+")";
  const H=st.filter(x=>x.st==="HIGH"), E=st.filter(x=>x.st==="ELEVATED");
  let s="AEK CK "+fmtDL(ld)+"\nTested "+st.length+"/"+P.length+"\n";

  s+="\n\nELEVATED ("+E.length+")\n"+(E.map(line).join("\n")||"none");

function copyText(t){

function fallbackCopy(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Copied");}catch(e){toast("Select and copy by hand");} ta.remove(); }

/* ============ HRV \u00B7 METHOD ============ */
function vHrvMethod(){
  setTitle("HRV method","How the morning reading is taken and read");
  document.getElementById("view").innerHTML=`
  <div class="card c6"><div class="head"><div><div class="eyebrow">What it is</div><h2>Why variability, not heart rate</h2></div></div>
    <div class="note">Between two heartbeats the gap is never exactly the same. That variation comes from the vagus nerve braking the heart, so the size of the variation is a window on the parasympathetic side of the autonomic nervous system. A player who has absorbed his training load shows his usual variation in the morning. A player who has not shows less of it, often before he reports feeling worse and before any drop in output on the pitch.</div>
    <div class="note" style="margin-top:10px">The app works in <b>RMSSD</b>, the root mean square of successive differences between beats. It is the field standard for short recordings: it reflects vagal activity and is far less sensitive to breathing rate than the frequency-domain measures. RMSSD is skewed, so everything is computed on its natural log, <b>lnRMSSD</b>. The number on screen is 20 x lnRMSSD, which is the 0 to 100 style score most HRV apps print, so a value of 70 means the same here as on the device.</div>
  </div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Protocol</div><h2>Same way every morning</h2></div></div>
    <div class="stepper"><div class="d y">1</div><div><b>On waking, before anything else</b><span>After the toilet, before coffee, food, phone scrolling, cold shower or training. Within the same half hour each day.</span></div></div>
    <div class="stepper"><div class="d">2</div><div><b>Fixed position</b><span>Seated or supine, chosen once and never mixed. Supine gives higher values than seated, so a change of position looks like a change of recovery when it is not.</span></div></div>
    <div class="stepper"><div class="d">3</div><div><b>One to five minutes, first minute discarded</b><span>Record two to five minutes and let the device use the stable part. Breathe normally; do not pace the breath unless every player does it the same way every day.</span></div></div>
    <div class="stepper"><div class="d">4</div><div><b>Daily if you can, four mornings minimum</b><span>Single values are noisy. Trends need frequency: daily is best, and at least four mornings a week on the same days keeps the weekly mean honest.</span></div></div>
  </div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Reading it</div><h2>Band, trend, stability</h2></div></div>
    <div class="note"><b>Never compare players.</b> Absolute HRV differs enormously between people; a 45 in one player and a 95 in another can both be normal. Every reading here is compared only with that player's own history.</div>
    <div class="note" style="margin-top:10px"><b>The band.</b> The rolling ${S.settings.hrvWin}-day mean of lnRMSSD plus or minus ${S.settings.hrvSwc} SD, the smallest worthwhile change. Inside the band is a normal morning for him.</div>
    <div class="note" style="margin-top:10px"><b>Watch.</b> One morning below the band. Usually noise: a short night, a late meal, a flight, a hard session the evening before.</div>
    <div class="note" style="margin-top:10px"><b>Low.</b> Two mornings below the band in a row, or a 7-day mean below it. This is the one worth a conversation and a look at the week's load.</div>
    <div class="note" style="margin-top:10px"><b>Above band.</b> Normally a well-recovered morning. Read it carefully when it arrives together with heavy fatigue and soreness reports after a block of hard training, where unusually high values can accompany deep fatigue rather than freshness.</div>
    <div class="note" style="margin-top:10px"><b>Unstable week.</b> The coefficient of variation of the last 7 mornings above ${S.settings.cvHigh}%. A player whose day-to-day values swing is coping less well than the weekly mean alone suggests.</div>
  </div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Care</div><h2>What else moves it</h2></div></div>
    <div class="note">Alcohol, illness and fever, poor or short sleep, dehydration, travel and time zones, heat, altitude, psychological stress, caffeine before the reading, and for female athletes the menstrual cycle all move HRV without any change in training load. Before reading a low morning as fatigue, ask about those.</div>
    <div class="note" style="margin-top:10px">HRV is a screening prompt, not a diagnosis. Read it next to the morning wellness check, the session plan and GPS output, and alongside CK when a draw is available. Where the two markers disagree, the training decision stays with the coach and the medical team.</div>
    <div class="note" style="margin-top:10px">References: Task Force of the European Society of Cardiology and NASPE 1996 (measurement standards); Plews, Laursen, Stanley, Kilding and Buchheit 2013 (Sports Medicine); Plews et al. 2013 (variation in variability); Buchheit 2014 (Frontiers in Physiology); Bellenger et al. 2016 (systematic review and meta-analysis); Flatt and Esco 2015 (smartphone HRV in a women's soccer team); Nakamura et al. 2016 (weekly HRV in the preseason).</div>
  </div>`;
}

/* No browser dialogs here, so a button that undoes something asks on the button itself:
   the first click turns it into the question, the second one does it. */
function armButton(btn,label,fn){
  if(btn.dataset.armed==="1"){
    btn.dataset.armed=""; clearTimeout(btn._t);
    btn.textContent=btn.dataset.old||btn.textContent;
    btn.classList.remove("danger");
    fn(); return;
  }
  btn.dataset.armed="1"; btn.dataset.old=btn.textContent;
  btn.textContent=label; btn.classList.add("danger");
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{
    btn.dataset.armed=""; btn.textContent=btn.dataset.old||btn.textContent;
    btn.classList.remove("danger");
  },8000);
}
function svgChart(t,base){
  const W=720,H=260,L=42,R=14,T=16,B=34;
  if(!t.length) return '<svg viewBox="0 0 '+W+" "+H+'"><text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" fill="var(--muted)" font-family="Barlow" font-size="14">No CK samples yet</text></svg>';
  const vals=t.map(x=>x.val);
  let maxV=Math.max(...vals,base?base*S.settings.high*1.1:0)*1.1; maxV=Math.ceil(maxV/100)*100||100;
  const n=t.length, xs=i=>n===1?(L+(W-L-R)/2):L+(W-L-R)*i/(n-1), ys=v=>T+(H-T-B)*(1-v/maxV);
  let g=""; const step=maxV<=600?100:maxV<=1500?250:500;
  for(let v=0;v<=maxV;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="var(--line)" stroke-dasharray="2 4"/><text x="'+(L-6)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow">'+v+"</text>";
  let bands="";
  if(base){
    bands+='<rect x="'+L+'" y="'+ys(maxV)+'" width="'+(W-L-R)+'" height="'+Math.max(0,ys(base*S.settings.high)-ys(maxV))+'" fill="var(--bad)" opacity=".06"/>';
    bands+='<rect x="'+L+'" y="'+ys(base*S.settings.high)+'" width="'+(W-L-R)+'" height="'+Math.max(0,ys(base*S.settings.elev)-ys(base*S.settings.high))+'" fill="var(--warn)" opacity=".08"/>';
    bands+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(base)+'" y2="'+ys(base)+'" stroke="var(--accent)" stroke-width="2.5"/>';
    bands+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(base*S.settings.elev)+'" y2="'+ys(base*S.settings.elev)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    bands+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(base*S.settings.high)+'" y2="'+ys(base*S.settings.high)+'" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  }
  const path=t.map((x,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(x.val).toFixed(1)).join(" ");
  const pts=t.map((x,i)=>{
    const c=ACT_COLOR[x.act]||"var(--fg)", pc=base?x.val/base:null;
    const ring=pc!=null&&pc>=S.settings.high?'<circle cx="'+xs(i)+'" cy="'+ys(x.val)+'" r="10" fill="none" stroke="var(--bad)" stroke-width="2"/>':"";
    return ring+'<circle cx="'+xs(i)+'" cy="'+ys(x.val)+'" r="5.5" fill="'+c+'" stroke="var(--surface)" stroke-width="2"><title>'+fmtDL(x.date)+" \u00B7 "+x.act+" \u00B7 "+r0(x.val)+" U/L"+(pc!=null?" \u00B7 "+Math.round(pc*100)+"%":"")+"</title></circle>";
  }).join("");
  const lbl=t.map((x,i)=>{
    const show=n<=8||i%Math.ceil(n/8)===0||i===n-1;
    return show?'<text x="'+xs(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Barlow">'+fmtD(x.date)+"</text>":"";
  }).join("");
  return '<svg viewBox="0 0 '+W+" "+H+'">'+g+bands+'<path d="'+path+'" fill="none" stroke="var(--fg)" stroke-width="1.5" opacity=".35"/>'+pts+lbl+"</svg>";
}
function svgHrv(h){
  const W=720,H=250,L=42,R=14,T=16,B=34;
  const all=h.all.slice(-28);
  if(!all.length) return '<svg viewBox="0 0 '+W+" "+H+'"><text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" fill="var(--muted)" font-family="Barlow" font-size="14">No HRV samples yet</text></svg>';
  const vs=all.map(x=>sc(Math.log(x.rmssd)));
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(h.lo!=null){ lo=Math.min(lo,sc(h.lo)); hi=Math.max(hi,sc(h.hi)); }
  const pad=Math.max(4,(hi-lo)*0.25); lo=Math.floor((lo-pad)/5)*5; hi=Math.ceil((hi+pad)/5)*5;
  const n=all.length, xs=i=>n===1?(L+(W-L-R)/2):L+(W-L-R)*i/(n-1), ys=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
  let g="";
  const step=(hi-lo)<=30?5:(hi-lo)<=60?10:20;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="var(--line)" stroke-dasharray="2 4"/><text x="'+(L-6)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow">'+v+"</text>";
  let band="";
  if(h.lo!=null){
    const yt=ys(sc(h.hi)), yb=ys(sc(h.lo));
    band='<rect x="'+L+'" y="'+yt+'" width="'+(W-L-R)+'" height="'+Math.max(1,yb-yt)+'" fill="var(--good)" opacity=".16"/>'
      +'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(sc(h.m))+'" y2="'+ys(sc(h.m))+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  }
  /* rolling mean over the plotted window */
  const roll=all.map((x,i)=>{
    const from=dAdd(x.date,-(S.settings.hrvRoll||7)+1);
    const w=all.filter((y,j)=>j<=i&&y.date>=from).map(y=>Math.log(y.rmssd));
    return w.length>=3?sc(mean(w)):null;
  });
  let rp="",started=false;
  roll.forEach((v,i)=>{ if(v==null){started=false;return;} rp+=(started?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1)+" "; started=true; });
  const path=all.map((x,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(vs[i]).toFixed(1)).join(" ");
  const pts=all.map((x,i)=>{
    const v=Math.log(x.rmssd);
    const c=h.lo==null?"var(--muted)":v<h.lo?"var(--bad)":v>h.hi?"var(--info)":"var(--good)";
    return '<circle cx="'+xs(i)+'" cy="'+ys(vs[i])+'" r="4.5" fill="'+c+'" stroke="var(--surface)" stroke-width="1.8"><title>'+fmtDL(x.date)+" \u00B7 RMSSD "+r0(x.rmssd)+" ms \u00B7 score "+r0(vs[i])+(x.hr!=null?" \u00B7 HR "+r0(x.hr):"")+"</title></circle>";
  }).join("");
  const lbl=all.map((x,i)=>{
    const show=n<=8||i%Math.ceil(n/8)===0||i===n-1;
    return show?'<text x="'+xs(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Barlow">'+fmtD(x.date)+"</text>":"";
  }).join("");
  return '<svg viewBox="0 0 '+W+" "+H+'">'+g+band+'<path d="'+path+'" fill="none" stroke="var(--muted)" stroke-width="1.2" opacity=".45"/>'
    +(rp?'<path d="'+rp.trim()+'" fill="none" stroke="var(--fg)" stroke-width="2"/>':"")+pts+lbl+"</svg>";
}

  </div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Backup</div><h2>Snapshot and import</h2></div><span class="pill">${nD} draw${nD===1?"":"s"}</span></div>
    <div class="note"><b>Share snapshot</b> saves a copy of this app with all current data inside, to send as a document. Whoever opens it can keep entering offline. <b>Import</b> merges such a file back in, newest entry per player and date wins.</div>
    <div class="field" style="margin-top:12px"><label>Your name on the snapshot</label><input class="inp" id="sBy" placeholder="e.g. Goran" value="${esc(S.settings.by||"")}"></div>
    <button class="btn sm" style="margin-top:12px;width:100%" id="expS">Share snapshot (HTML with data)</button>
    <label class="btn dark sm" style="margin-top:10px;display:flex;width:100%">Import snapshot or backup<input type="file" accept=".html,.htm,.json,text/html,application/json" id="impJ" class="hidden"></label>
  </div>
  <div class="card c6"><div class="head"><div><div class="eyebrow">Squad list</div><h2>Roster</h2></div>${ro?"":'<button class="btn ghost sm" id="addP">Add player</button>'}</div>
    <div class="twrap"><table class="table">${roster}</table></div>
    <div class="note" style="margin-top:10px">Hidden players keep their history and can be restored. ${ro?"":"Changes to the roster reach the whole staff."}</div>
  </div>`;
  const rs=document.getElementById("reSync");
  if(rs) rs.onclick=()=>{ clearTimeout(flushTmr); flush(); if(LIVE.mode==="net") pullNet(false); toast("Checking"); };
  const sb=document.getElementById("signBtn");
  if(sb) sb.onclick=()=>{
    if(LIVE.mode!=="net"){ showGate(""); return; }
    armButton(sb,"Tap again to sign out",()=>{
      clearInterval(pollTmr); saveNet({pin:"",name:"",since:0});
      LIVE.mode="off"; LIVE.name=""; setState("off"); render(); showGate("");
    });
  };
  document.getElementById("expJ").onclick=()=>download("AEK_CK_HRV_backup_"+todayISO()+".json",JSON.stringify(S,null,1));
  document.getElementById("expC").onclick=()=>{
    const pm=Object.fromEntries(S.players.map(p=>[p.id,p]));
    let csv="date;number;player;position;marker;value;unit;activity_or_position;reference;pct_or_score;status;entered_by\n";
    const rows=[];
    S.tests.forEach(t=>{
      const p=pm[t.pid]||{}, b=baselineOf(t.pid).v, pc=b?t.val/b:null;
      rows.push([t.date,p.num||"",p.name||"",p.pos||"","CK",Math.round(t.val),"U/L",t.act,b?Math.round(b):"",pc!=null?Math.round(pc*100):"",
        pc==null?"":pc>=S.settings.high?"HIGH":pc>=S.settings.elev?"ELEVATED":"NORMAL",nameOf(t.by)]);
    });
    S.hrv.forEach(h=>{
      const p=pm[h.pid]||{}, st=hrvStat(h.pid,h.date);
      rows.push([h.date,p.num||"",p.name||"",p.pos||"","HRV",Math.round(h.rmssd),"ms",h.pos||"",
        st.lo!=null?Math.round(sc(st.lo))+"-"+Math.round(sc(st.hi)):"",Math.round(sc(Math.log(h.rmssd))),
        st.last&&st.last.date===h.date?st.st:"",nameOf(h.by)]);
    });
    rows.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).forEach(r=>{csv+=r.join(";")+"\n";});
    download("AEK_CK_HRV_"+todayISO()+".csv",String.fromCharCode(0xFEFF)+csv);
  };
  document.getElementById("sBy").onchange=e=>{S.settings.by=e.target.value.trim();save();};
  document.getElementById("expS").onclick=()=>{
    const snap=JSON.parse(JSON.stringify(S));
    snap.exportedAt=Date.now(); snap.exportedBy=S.settings.by||((LIVE.me&&LIVE.me.name)||""); delete snap.absorbedSnapshot;
    const json=JSON.stringify(snap).replace(/<\//g,"<\\/");
    const el=document.getElementById("aekck-data"), prev=el.textContent;
    el.textContent=json;
    const html="<!doctype html>\n"+document.documentElement.outerHTML;
    el.textContent=prev;
    download("AEK_CK_HRV_"+todayISO()+(snap.exportedBy?"_"+String(snap.exportedBy).replace(/\s+/g,"_"):"")+".html",html);
  };
  document.getElementById("impJ").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        let txt=rd.result,o=null;
        if(/^\s*</.test(txt)){ const m=txt.match(/<script id="aekck-data" type="application\/json">([\s\S]*?)<\/script>/); if(!m||!m[1].trim()) throw 0; o=JSON.parse(m[1].replace(/<\\\//g,"</")); }
        else o=JSON.parse(txt);
        if(!o||!o.players||!Array.isArray(o.tests)) throw 0;
        const r=mergeInto(S,o);
        if(o.exportedAt) S.absorbedSnapshot=Math.max(S.absorbedSnapshot||0,o.exportedAt);
        save(); pushAllLocal(); render();
        toast("Merged: "+r.added+" new, "+r.updated+" updated");
      }catch(err){ toast("Not a valid snapshot or backup"); }
    };
    rd.readAsText(f); e.target.value="";
  };
  const setT=()=>{
    const el=parseFloat(document.getElementById("sElev").value), hi=parseFloat(document.getElementById("sHigh").value);
    const sw=parseFloat(document.getElementById("sSwc").value), wi=parseFloat(document.getElementById("sWin").value), cv=parseFloat(document.getElementById("sCv").value);
    if(!(el>=1&&hi>el)){ toast("CK high must be above elevated"); return; }
    if(!(sw>0&&wi>=7&&cv>0)){ toast("Check the HRV settings"); return; }
    Object.assign(S.settings,{elev:el,high:hi,hrvSwc:sw,hrvWin:Math.round(wi),cvHigh:cv,ts:Date.now()});
    save(); mark("cfg","app"); toast("Thresholds saved for the staff"); render();
  };
  ["sElev","sHigh","sSwc","sWin","sCv"].forEach(id=>{ const el=document.getElementById(id); if(el&&!el.disabled) el.onchange=setT; });
  document.querySelectorAll("[data-num]").forEach(i=>i.onchange=()=>{ const p=S.players.find(x=>x.id===i.dataset.num); p.num=i.value.trim(); p.ts=Date.now(); save(); mark("squad",p.id); });
  document.querySelectorAll("[data-name]").forEach(i=>i.onchange=()=>{ const p=S.players.find(x=>x.id===i.dataset.name); if(i.value.trim()){ p.name=i.value.trim(); p.ts=Date.now(); save(); mark("squad",p.id); } });
  document.querySelectorAll("[data-pos]").forEach(i=>i.onchange=()=>{ const p=S.players.find(x=>x.id===i.dataset.pos); p.pos=i.value; p.ts=Date.now(); save(); mark("squad",p.id); });
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{ const p=S.players.find(x=>x.id===b.dataset.tog); p.active=p.active===false?true:false; p.ts=Date.now(); save(); mark("squad",p.id); render(); });
  const ap=document.getElementById("addP");
  if(ap) ap.onclick=()=>{
    const row=document.createElement("div");
    row.className="field"; row.style.marginTop="10px";
    row.innerHTML='<label>New player name</label><div class="row2"><input class="inp" id="npName" placeholder="Surname"><button class="btn sm" id="npOk">Add</button></div>';
    ap.replaceWith(row);
    document.getElementById("npOk").onclick=()=>{
      const n=(document.getElementById("npName").value||"").trim();
      if(!n){ toast("Type a name first"); return; }
      S.players.push({id:uid(),num:"",name:n,pos:"MID",active:true,ts:Date.now()});
      save(); mark("squad",S.players[S.players.length-1].id); render(); toast(n+" added");
    };
    document.getElementById("npName").focus();
  };
}
async function download(name,content){
  try{
    if(window.claude&&window.claude.use){
      const d=await window.claude.use("downloads");
      if(d){ await d.save({filename:name,data:content}); toast("Saved"); return; }
    }
  }catch(e){ if(e&&e.code==="declined"){ return; } }
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([content],{type:"text/plain"}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(e){ toast("Could not save the file here"); }
}

/* ============ BOOT ============ */
applyLook();
crestInit();
if(!S.tests.length&&!S.hrv.length&&!Object.keys(S.baseline).length) route="baseline";
render();
if(bootMsg) setTimeout(()=>toast(bootMsg),400);
initLive().then(()=>{ if(LIVE.mode!=="off"&&(S.tests.length||S.hrv.length||Object.keys(S.baseline).length)) setTimeout(()=>{ if(LIVE.state==="on") pushAllLocal(); },2500); });
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(LIVE.state==="err"){ clearTimeout(flushTmr); flush(); }
  if(LIVE.mode==="net"&&!flushing) pullNet(false);
});
window.addEventListener("online",()=>{ if(LIVE.mode==="net"){ clearTimeout(flushTmr); flush(); pullNet(false); } });
</script>
